name: CD - Web

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  deploy-web:
    runs-on: ubuntu-latest
    environment: production
    needs: []

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET 10
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: Restore
        run: dotnet restore TCGManager.slnx

      - name: Build & Publish Web
        run: |
          dotnet publish src/Presentation/TCGManager.Web \
            --configuration Release \
            --output ./publish/web

      - name: Login to Azure
        uses: azure/login@v2
        with:
          creds: ${{ secrets.AZURE_CREDENTIALS }}

      - name: Deploy Web to Azure App Service
        uses: azure/webapps-deploy@v3
        with:
          app-name: tcgmanager-web
          package: ./publish/web

      - name: Health Check Web
        run: |
          sleep 30
          STATUS=$(curl -s -o /dev/null -w "%{http_code}" \
            https://tcgmanager-web.azurewebsites.net)
          echo "Web status: $STATUS"